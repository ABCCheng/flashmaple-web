<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>FlashMaple — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #1c1c1e;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #1b1b1f;
          color: #e5e5e5;
        }
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100svh;
        margin: 0;
        padding: 2rem;
        place-items: center;
        text-align: center;
        background: radial-gradient(circle at 15% 5%, rgb(211 0 28 / 0.1), transparent 30rem), transparent;
      }

      main {
        width: min(100%, 26rem);
      }

      img {
        width: 4.5rem;
        height: 4.5rem;
        margin-bottom: 1.25rem;
        border-radius: 1.25rem;
      }

      h1 {
        margin: 0;
        color: #d3001c;
        font-size: clamp(1.75rem, 8vw, 2.5rem);
        letter-spacing: -0.06em;
      }

      p {
        margin: 0.75rem 0 0;
        line-height: 1.6;
        opacity: 0.72;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-192.png" alt="FlashMaple" />
      <h1>You're offline</h1>
      <p>Open FlashMaple again when you have a connection. Your previously visited app pages may still be available.</p>
    </main>
  </body>
</html>
